name: Static Analysis

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        activate-environment: true
    - run: uv sync --locked
    - uses: astral-sh/ruff-action@v4.1.0
    - run: uv run ty check
