name: Static Analysis

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        activate-environment: true
    - run: uv sync --locked
    - uses: astral-sh/ruff-action@v4.1.0
    - run: uv run ty check
