name: Static Analysis

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        activate-environment: true
    - run: uv sync --locked
    - uses: astral-sh/ruff-action@v4.1.0
    - run: uv run ty check
