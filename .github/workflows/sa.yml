name: Static Analysis

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        activate-environment: true
    - run: uv sync --locked
    - uses: astral-sh/ruff-action@v4.1.0
    - run: uv run ty check
