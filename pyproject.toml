[project]
name = "system-packages-checks"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "aiohttp==3.14.3",
    "pyyaml==6.0.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",
    "ty==0.0.73",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["LOG015", "DTZ006", "PLR2004", "E501", "D101", "D107", "D102", "C901", "ASYNC230", "D103", "N802", "PLR0912", "T201", "D100", "CPY001"]
